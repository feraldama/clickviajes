name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    name: Typecheck, tests y build
    runs-on: ubuntu-latest

    # Postgres de servicio para los tests de integración de la API.
    # Coincide con la URL de test fija en apps/api/vitest.config.ts.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: "12345"
          POSTGRES_DB: clickviajes_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      # Usada por `prisma generate` y como base; los tests usan su propia URL de test
      # (misma instancia) definida en vitest.config.ts.
      DATABASE_URL: postgresql://postgres:12345@localhost:5432/clickviajes_test?schema=public

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Generar Prisma Client
        run: pnpm --filter @clickviajes/api exec prisma generate

      - name: Typecheck
        run: pnpm typecheck

      - name: Tests (unit + integración)
        run: pnpm test

      - name: Build
        run: pnpm build
